name: Vulncheck

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  vulncheck:
    name: Run govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26' # GO_VERSION_DEF
          check-latest: true
      - name: Get official govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
        shell: bash
      - name: Run govulncheck
        run: govulncheck ./...
        shell: bash
  versioncheck:
    name: Run go-supported-version-check
    runs-on: ubuntu-latest
    steps:
      - name: Go Supported Version
        uses: dopplerhq/go-supported-version-check-action@56fa9474fc6a8a9ffd3a58ebee78be915609a937 # v2.0.0
        with:
          go-version: "1.26" # GO_VERSION_DEF
          version-requirement: any-supported
